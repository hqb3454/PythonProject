# 校园代码智能助手 —— nginx 统一入口配置
# 监听 127.0.0.1:5180（复用原 Vite 端口，本地 SSH 隧道命令保持不变）：
#   /      -> frontend/dist 静态文件（npm run build 产物）
#   /api/  -> 反向代理到 FastAPI 127.0.0.1:8000
# 部署：cp cloud-deploy/nginx/campus.conf /etc/nginx/conf.d/campus.conf && systemctl reload nginx
# 注意：改动前端源码后需重新 npm run build，nginx 无需重启（静态文件即时生效）。

server {
    listen 127.0.0.1:5180;
    server_name _;

    root /opt/campus-assistant/repo/ai-coding-app/frontend/dist;
    index index.html;

    # 大模型（Kimi 推理模型）响应可能较慢，放宽代理超时
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        # SPA 路由回退：所有非文件路径都返回 index.html
        try_files $uri $uri/ /index.html;
    }
}
